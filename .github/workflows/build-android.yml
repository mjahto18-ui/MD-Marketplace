name: Build Android AAB

on:
  push:
    branches: [ last-update ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install TypeScript
        run: npm install -D typescript

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@^8 @capacitor/cli@^8 --legacy-peer-deps
          npm install @capacitor/android@^8 --legacy-peer-deps
          npm install @capacitor/geolocation@^8 @capacitor/push-notifications@^8 --legacy-peer-deps
          npm install @capacitor-community/background-geolocation --legacy-peer-deps
          npm install onesignal-cordova-plugin --legacy-peer-deps
      - name: Make dummy webDir for Capacitor
        run: |
          mkdir -p out
          echo "<h1>MD-Marketplace</h1>" > out/index.html

      - name: Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Add Background Location Permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "ACCESS_BACKGROUND_LOCATION" $MANIFEST || sed -i 's|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />|' $MANIFEST
          cat $MANIFEST

      - name: Build AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MD-Marketplace-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Build APK for Testing
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Marketplace-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
